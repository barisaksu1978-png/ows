name: OWS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run integration checks
        run: npm run verify:integration

      - name: Run existing validators
        run: |
          node scripts/verify-dossier-detail.mjs
          node scripts/verify-four-fixes.mjs
          node scripts/verify-i18n.mjs
          node scripts/verify-netlify-build.mjs
